;padding:9px;font-size:11px;color:#475467;line-height:1.55}.simple-later strong{color:var(--blue)}.decision-title{font-size:13px;font-weight:800;margin-bottom:7px}.decision-summary{font-size:12px;color:#344054;line-height:1.65}.decision-evidence{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:11px}.evidence-item{background:var(--surface2);border-radius:8px;padding:8px}.evidence-label{font-size:10px;color:var(--muted)}.evidence-value{font-size:12px;font-weight:700;margin-top:2px;word-break:break-all}.rule-box{background:var(--blue2);border-radius:10px;padding:11px 13px;margin:14px 0;color:#31548e;font-size:11px;line-height:1.65}.rule-box strong{color:#1d4ed8}.reason-row-detail{color:var(--muted);font-size:10px}.click-hint{font-size:10px;color:var(--blue);font-weight:700;margin-top:3px}.sub-grid{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.sub-tag{display:inline-flex;border-radius:99px;padding:2px 7px;font-size:10px;font-weight:600;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}@media(max-width:980px){.app{padding:20px}.grid4{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.topbar{gap:15px;flex-direction:column}.meta{text-align:left}}

5px;color:#475467;font-size:11px;line-height:1.5}.compact-link{margin-top:5px;color:var(--blue);font-size:10px;font-weight:700}.raw-details{margin-top:15px;border-top:1px solid var(--line);padding-top:14px}.raw-details summary{cursor:pointer;color:var(--muted);font-size:12px;font-weight:700}.raw-details .reason-table{margin-top:12px}.reason-drawer{padding-bottom:20px}.reason-kicker{color:var(--blue);font-size:10px;font-weight:800;letter-spacing:.08em;margin-bottom:4px}.reason-head p{margin:7px 0 0;color:var(--muted);font-size:12px;line-height:1.55}.reason-table{width:100%;border-collapse:collapse;font-size:11px}.reason-table th{text-align:left;padding:9px;background:var(--surface2);color:var(--muted);font-weight:700}.reason-table td{padding:10px 9px;border-bottom:1px solid var(--line);vertical-align:top}.reason-table small{color:var(--muted);line-height:1.4}.reason-tag{display:inline-flex;padding:3px 7px;border-radius:99px;font-size:10px;font-weight:700;background:var(--surface2);color:var(--muted)}.reason-tag.r0{background:var(--red2);color:var(--red)}.reason-tag.r1,.reason-tag.r2{background:var(--amber2);color:var(--amber)}.reason-tag.r3{background:var(--green2);color:var(--green)}.reason-tag.r4{background:#f1f3f7;color:var(--muted)}@media(max-width:720px){.reason-summary{grid-template-columns:1fr}.inference-note{display:block}.inference-note strong{display:block;margin-bottom:4px}.compact-main{flex-wrap:wrap}.compact-last{width:100%;order:3}.drawer-card{width:100%;padding:18px}.reason-table{min-width:680px}}</style>

<body>
<div class="app" id="app"><div class="empty">正在加载真实行为数据…</div></div>
<div class="drawer" id="drawer"><div class="drawer-card"><div class="drawer-top"><div><div class="eyebrow">USER TIMELINE</div><h2 id="drawerTitle">用户行为时间线</h2></div><button class="close" id="close">×</button></div><div id="drawerMeta"></div><div class="timeline" id="timeline"></div></div></div>
<script>
const reasonClassMap={'离开后七日内未回来':'r0','反复尝试但仍未继续':'r0','回到本阶段，但仍未进入下一步':'r1','隔天回来，但仍未进入下一步':'r2','未产生下一阶段事件':'r3','原始事件不足，无法判定':'r4'};
const subLabel={'进入产品/登录与资料完善':'登录与资料完善','进入产品/进入首页':'进入首页','探索内容/首页Feed':'首页Feed','探索内容/搜索':'搜索','探索内容/点歌/选歌':'点歌选歌','探索内容/个人主页':'个人主页','探索内容/他人主页':'他人主页','探索内容/内容浏览':'内容浏览','首次互动/点赞':'点赞','首次互动/评论':'评论','首次互动/关注':'关注','首次互动/进房':'进房','首次互动/播放':'播放','首次互动/送礼':'送礼','首次互动/其他互动':'其他互动','首次创作/录音准备':'录音准备','首次创作/录音':'录音','首次创作/编辑':'编辑','首次创作/发布':'发布','首次创作/创作流程':'创作流程'};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const pct=(n,d)=>d?`${(n/d*100).toFixed(1)}%`:'—';
function statusClass(s){return s.includes('完成')?'ok':s.includes('回来')?'warn':'bad'}
function statusLabel(s){return s==='当次中断后恢复'?'回来过当前阶段，但仍未完成下一步':s}
function inferenceFor(item,stage,next){
  const later=(item.laterBehaviorSummary||'').toLowerCase();
  const rel=Object.entries(item.laterRelationshipCounts||{});
  const relTotal=rel.reduce((sum,x)=>sum+x[1],0);
  const lowTime=Number(item.durationMin||0)<5;
  if(item.reason==='离开后七日内未回来'&&lowTime)return {key:'low-investment',title:'浅尝后离开',text:'首日使用时间较短，用户可能还没有形成明确兴趣或使用习惯。',evidence:`首日仅 ${item.durationMin} 分钟，且观察期内没有再次回来`};
  if(stage==='形成关系'&&relTotal>0&&item.laterActivity)return {key:'weak-relationship',title:'有关系行为，但没有形成持续联系',text:'用户做过私信、关注或社交玩法，但后续行为没有转化为下一次回来，可能是关系连接较弱、互动没有得到回应，或缺少继续联系的理由。',evidence:`形成关系相关行为 ${relTotal} 次；${item.laterEventCount||0} 条后续事件仍未带来下一次回来`};
  if(stage==='形成关系'&&/探索内容|首次创作/.test(later))return {key:'other-preference',title:'兴趣停留在浏览或创作，没有继续社交',text:'用户后续仍在浏览内容或尝试创作，但没有继续关系行为，可能更偏好内容消费或创作，而不是社交关系。',evidence:'后续行为主要是浏览内容/创作，未看到持续的关系行为'};
  if(item.reason==='未产生下一阶段事件'&&item.laterActivity)return {key:'same-day-stop',title:'仍在使用，但卡在当前阶段',text:`用户之后还有行为，却没有完成“${next}”，可能是当前入口不够清晰、下一步价值不明显，或用户选择了另一条使用路径。`,evidence:`之后仍有 ${item.laterEventCount||0} 条事件，但没有进入“${next}”`};
  if(item.reason==='隔天回来，但仍未进入下一步')return {key:'revisit-no-convert',title:'回来过，但没有完成下一步',text:'用户有回访或重复浏览，说明不是完全没有兴趣；但回访后仍未转化，可能是核心价值没有被理解，或下一步触发时机不合适。',evidence:`回来后仍有 ${item.reEntries||0} 次当前阶段行为，但没有进入“${next}”`};
  return {key:'unclear',title:'行为证据不足，暂时无法判断',text:'当前事件能确认用户没有进入下一阶段，但不足以判断具体动机，需要结合访谈、问卷或更多样本验证。',evidence:'仅依据埋点行为推测，不能等同于用户真实原因'};
}
function inferenceGroups(items,stage,next){const groups={};items.forEach(item=>{const x=inferenceFor(item,stage,next);if(!groups[x.key])groups[x.key]={...x,items:[]};groups[x.key].items.push(item)});return Object.values(groups)}
function compactEvidence(item,stage,next){const x=inferenceFor(item,stage,next);return `<div class="compact-evidence" data-uid="${esc(item.uid)}"><div class="compact-main"><strong>${esc(item.uid)}</strong><span>${esc(item.durationMin)} min</span><span class="compact-last">最后：${esc(item.lastPage||'未识别')}</span></div><div class="compact-detail">${esc(x.evidence)} · 最后停留：${esc(item.lastDate.slice(5))} ${esc(item.lastTime)}</div><div class="compact-link">点击查看完整时间线 →</div></div>`}

function render(d){const s=d.summary, users=d.users, sr=d.stageReasons||[];const stages=s.stageAgg;
const srMap={};sr.forEach(x=>srMap[x.stage]=x);

// Sub-stages per primary stage from user data
const stageSubs={};
users.forEach(u=>{(u.subReached||[]).forEach(k=>{const[primary,sub]=k.split('/');if(!stageSubs[primary])stageSubs[primary]=new Set();stageSubs[primary].add(sub)})});

document.getElementById('app').innerHTML=`
<header class="topbar"><div class="brand"><div class="brand-mark">回</div><div><div class="eyebrow">NEW USER EXPERIENCE / REAL DATA</div><h1>回森新用户行为路径健康看板</h1><p>新用户承接六阶段链路 · 识别卡点与恢复</p></div></div><div class="meta"><div>观察窗口：<strong>2026.08.08 — 2026.08.14</strong></div><div>筛选口径：2026.8.8 新设备 24 个 · 可按首日时长筛选</div><div class="pill">渠道字段未在源文档提供，未擅自分层</div></div></header>
<div class="grid4"><div class="card stat"><div class="stat-label">纳入设备 <span>样本</span></div><div class="stat-value blue">${s.sampleTotal}</div><div class="stat-foot">总览设备 24 个，符合时长门槛</div></div><div class="card stat"><div class="stat-label">七日事件 <span>原始记录</span></div><div class="stat-value">${s.eventTotal.toLocaleString()}</div><div class="stat-foot">覆盖 8.8—8.14 七个页签</div></div><div class="card stat"><div class="stat-label">主路径完成 <span>到达创作/关系</span></div><div class="stat-value green">${users.filter(u=>u.reached['首次创作']||u.reached['形成关系']).length}</div><div class="stat-foot">完成率 ${pct(users.filter(u=>u.reached['首次创作']||u.reached['形成关系']).length,s.sampleTotal)}</div></div><div class="card stat"><div class="stat-label">未到达创作 <span>待关注</span></div><div class="stat-value amber">${users.filter(u=>!u.reached['首次创作']&&!u.reached['形成关系']).length}</div><div class="stat-foot">其中 ${users.filter(u=>u.status.includes('回来')).length} 个回来过但仍未完成</div></div></div>
<section class="section"><div class="section-title"><div><div class="tag">01 / PATH</div><h2>新用户承接链路</h2></div><p>点击「未继续」查看设备与原因</p></div><div class="card path"><div class="path-row">${stages.map((x,i)=>{const drop=srMap[x.stage]?.notContinued||0;const subs=stageSubs[x.stage]?[...stageSubs[x.stage]].slice(0,4):[];return`<div class="node"><div class="node-box"><div class="node-name">${esc(x.stage)}</div><div class="node-count">${x.reached}<small style="font-size:12px;color:var(--muted)"> / ${s.sampleTotal}</small></div><div class="node-rate">到达率 ${x.rate}%</div>${subs.length?`<div class="node-subs">${subs.map(s=>esc(subLabel[x.stage+'/'+s]||s)).join('、')}</div>`:''}</div>${i<stages.length-1?`<div class="node-drop${drop?'':' disabled'}" data-stage="${esc(x.stage)}">${drop?`−${drop} 未继续 ›`:''}</div>`:''}</div>`}).join('')}</div><div class="path-note">主路径按新用户承接六阶段归一化。未继续数量以设备级判定明细为准；灰色小字为该阶段下的细分行为。点击红色「未继续」可查看具体设备没有进入下一阶段的原因。</div></div></section>
<section class="section cols"><div class="card panel"><div class="panel-head"><h3>各阶段到达设备</h3><span>分母：${s.sampleTotal} 个设备</span></div><div class="bars">${stages.map(x=>`<div class="bar-row"><div class="bar-label">${esc(x.stage)}</div><div class="bar-bg"><div class="bar-fill" style="width:${x.rate}%"></div></div><div class="bar-value">${x.reached}</div></div>`).join('')}</div></div><div class="card panel"><div class="panel-head"><h3>卡点候选排行</h3><span>未继续设备</span></div><div>${sr.filter(x=>x.notContinued>0).sort((a,b)=>b.notContinued-a.notContinued).map(x=>`<div class="issue" style="cursor:pointer" data-stage-issue="${esc(x.stage)}"><div><div class="issue-name">${esc(x.stage)} → ${esc(x.nextStage)}</div><div class="issue-sub">${x.notContinued} 个设备未继续 · ${Object.entries(x.reasonCounts).map(([k,v])=>`${k} ${v}`).join('、')}</div></div><div class="issue-num">${x.notContinued}<small>未继续设备 ›</small></div></div>`).join('')||'<div class="empty">暂无卡点数据</div>'}</div></div></section>
<section class="section"><div class="section-title"><div><div class="tag">02 / USERS</div><h2>设备级行为明细</h2></div><div class="filters"><select id="statusFilter"><option value="all">全部状态</option><option value="完成">完成</option><option value="回来">回来过</option><option value="卡住">未完成</option></select><select id="stageFilter"><option value="all">全部最后节点</option>${stages.map(x=>`<option>${x.stage}</option>`).join('')}</select></div></div><div class="card panel table-wrap"><table class="users"><thead><tr><th>设备 UID</th><th>首日时长</th><th>七日事件</th><th>最后到达节点</th><th>最终状态</th><th>日期覆盖</th></tr></thead><tbody id="userRows"></tbody></table></div></section><div class="foot"><span>数据说明：${esc(s.channelNote)} · 未归类事件 ${s.unknownEvents.toLocaleString()} 条</span><span class="source">真实明细快照 · analysis.json</span></div>`;

document.querySelectorAll('.node-drop[data-stage]').forEach(el=>{if(!el.classList.contains('disabled'))el.onclick=()=>openReason(srMap[el.dataset.stage],users)});
document.querySelectorAll('[data-stage-issue]').forEach(el=>{el.onclick=()=>openReason(srMap[el.dataset.stageIssue],users)});

const rows=document.getElementById('userRows');
function fill(){const sf=document.getElementById('statusFilter').value,tf=document.getElementById('stageFilter').value;
const list=users.filter(u=>(sf==='all'||(sf==='完成'?u.status.includes('完成'):sf==='回来'?u.status.includes('回来'):!u.status.includes('完成')&&!u.status.includes('回来')))&&(tf==='all'||u.lastStage===tf));
rows.innerHTML=list.map(u=>`<tr data-uid="${u.uid}"><td><strong>${u.uid}</strong></td><td>${u.durationMin} min</td><td>${u.events.toLocaleString()}</td><td>${esc(u.lastStage)}</td><td><span class="status ${statusClass(u.status)}">${esc(statusLabel(u.status))}</span></td><td>${u.dates.join('、')}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">没有符合条件的设备</td></tr>';
rows.querySelectorAll('tr[data-uid]').forEach(r=>r.onclick=()=>openUser(users.find(u=>u.uid===r.dataset.uid)));}
fill();document.getElementById('statusFilter').onchange=fill;document.getElementById('stageFilter').onchange=fill;}

function openReason(reasonData,users){if(!reasonData)return;const r=reasonData;const groups=inferenceGroups(r.users,r.stage,r.nextStage);const noReturn=r.stage==='形成关系'&&r.nextStage==='后续回来';
document.getElementById('drawerTitle').textContent=`${r.stage} → ${r.nextStage}：为什么没有继续？`;
document.getElementById('drawerMeta').innerHTML=`<div class="reason-drawer"><div class="reason-head"><div class="reason-kicker">结论先看</div><h3>${r.notContinued} 个设备到达「${r.stage}」后没有进入「${r.nextStage}」</h3><p>${noReturn?'这批用户不是完全没有使用，而是形成关系后没有产生下一次回来。下面按行为特征给出可能原因。':'下面先看可能原因，再看对应设备；点击设备可以查看完整时间线。'}</p></div><div class="inference-note"><strong>可能原因，不是用户明确反馈</strong><span>这些判断来自使用时长、最后停留位置和后续埋点行为，只能作为分析线索，不能直接等同于用户真实想法。</span></div><div class="reason-summary"><div><span>未继续</span><strong>${r.notContinued}</strong></div><div><span>主要原因</span><strong>${esc(groups[0]?.title||'暂无法判断')}</strong></div><div><span>可确认事实</span><strong>${r.users.filter(x=>x.laterActivity).length} 个之后仍有行为</strong></div></div><div class="inference-groups">${groups.map((g,i)=>`<section class="inference-group"><div class="inference-group-head"><div><span class="inference-index">0${i+1}</span><strong>${esc(g.title)}</strong><p>${esc(g.text)}</p></div><b>${g.items.length} 个</b></div><div class="inference-evidence">${g.items.map(u=>compactEvidence(u,r.stage,r.nextStage)).join('')}</div></section>`).join('')}</div><details class="raw-details"><summary>需要时再看：原始判定明细（${r.users.length} 个设备）</summary><table class="reason-table"><thead><tr><th>设备</th><th>判定原因</th><th>最后行为</th><th>后续行为</th><th>回来过当前阶段</th></tr></thead><tbody>${r.users.map(u=>`<tr data-uid="${u.uid}"><td><strong>${u.uid}</strong></td><td><span class="reason-tag ${reasonClassMap[u.reason]||'r4'}">${esc(u.reason)}</span></td><td>${esc(u.lastDate.slice(5))}<br>${esc(u.lastTime)}<br><small>${esc(u.lastPage)}</small></td><td>${u.laterEventCount?`${u.laterEventCount} 条<br><small>${esc(u.laterBehaviorSummary||'')}</small>`:'无'}</td><td>${u.hasRecovery?'✓ 回到本阶段':'— 没回来'}</td></tr>`).join('')}</tbody></table></details></div>`;
document.getElementById('timeline').innerHTML='';document.getElementById('drawer').classList.add('open');
document.querySelectorAll('.reason-table tr[data-uid], .compact-evidence').forEach(el=>{el.onclick=()=>{const u=users.find(x=>x.uid===el.dataset.uid);if(u)openUser(u)}})}

function openUser(u){document.getElementById('drawerTitle').textContent=`${u.uid} · 行为时间线`;
document.getElementById('drawerMeta').innerHTML=`<div style="margin-bottom:14px"><div class="stat-label">首日时长</div><strong>${u.durationMin} min</strong></div><div style="margin-bottom:14px"><div class="stat-label">到达阶段</div><div class="sub-grid">${Object.entries(u.reached).filter(([k,v])=>v).map(([k])=>`<span class="sub-tag">${esc(k)}</span>`).join('')}</div></div><div style="margin-bottom:14px"><div class="stat-label">状态</div><span class="status ${statusClass(u.status)}">${esc(statusLabel(u.status))}</span></div><div style="margin-bottom:8px"><div class="stat-label">七日事件</div><strong>${u.events.toLocaleString()}</strong></div>`;
document.getElementById('timeline').innerHTML=u.timeline.map(e=>`<div class="event"><div class="event-time">${e.date.slice(5)}<br>${e.time.slice(0,8)}</div><div><div class="event-stage">${esc(e.stage)}</div><div class="event-sub">${esc(e.subStage||'')}<br><span style="color:var(--muted);font-weight:400">${e.role}</span></div></div><div class="event-body">${esc(e.body)}</div></div>`).join('');
document.getElementById('drawer').classList.add('open')}

document.getElementById('close').onclick=()=>document.getElementById('drawer').classList.remove('open');
document.getElementById('drawer').onclick=e=>{if(e.target.id==='drawer')e.currentTarget.classList.remove('open')};
fetch('analysis.json').then(r=>{if(!r.ok)throw new Error(`analysis.json 请求失败：${r.status}`);return r.json()}).then(render).catch(e=>{document.getElementById('app').innerHTML=`<div class="card empty">看板加载失败：${esc(e.message)}<br><small>请刷新页面重试，若仍失败请检查 analysis.json。</small></div>`;console.error(e)});
</script>
</body></html>

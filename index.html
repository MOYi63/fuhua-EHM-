<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>回森新用户行为路径健康看板</title>
<style>
:root{--bg:#f5f7fb;--surface:#fff;--surface2:#f8fafc;--ink:#101828;--muted:#667085;--line:#e6eaf0;--blue:#246bfe;--blue2:#eaf1ff;--green:#0e9f6e;--green2:#e8f8f1;--amber:#c97a12;--amber2:#fff4df;--red:#d92d20;--red2:#fff0ee;--purple:#7657d9;--shadow:0 8px 28px rgba(16,24,40,.06);--r:16px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,select{font:inherit}.app{max-width:1440px;margin:0 auto;padding:28px 34px 48px}.topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px}.brand{display:flex;gap:13px;align-items:flex-start}.brand-mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#246bfe,#6b8cff);color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px;box-shadow:0 8px 18px #246bfe33}.eyebrow{color:var(--blue);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.brand h1{font-size:25px;line-height:1.2;margin:2px 0 4px;letter-spacing:-.03em}.brand p{margin:0;color:var(--muted);font-size:12px}.meta{text-align:right;color:var(--muted);font-size:12px}.meta strong{color:var(--ink);font-weight:700}.pill{display:inline-flex;align-items:center;border-radius:99px;padding:5px 10px;margin-top:8px;background:var(--amber2);color:#925f10;font-size:11px;font-weight:700}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.stat{padding:18px 20px;min-height:113px}.stat-label{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}.stat-value{font-size:29px;font-weight:800;letter-spacing:-.04em;margin-top:11px}.stat-foot{color:var(--muted);font-size:11px;margin-top:2px}.blue{color:var(--blue)}.green{color:var(--green)}.red{color:var(--red)}.amber{color:var(--amber)}.section{margin-top:22px}.section-title{display:flex;align-items:end;justify-content:space-between;margin:0 0 11px}.section-title h2{margin:0;font-size:16px;letter-spacing:-.02em}.section-title p{margin:0;color:var(--muted);font-size:12px}.section-title .tag{color:var(--blue);font-size:11px;font-weight:800;letter-spacing:.1em}.path{padding:22px 22px 17px;overflow:auto}.path-row{display:flex;min-width:990px;align-items:stretch}.node{flex:1;min-width:128px;position:relative}.node:not(:last-child){margin-right:36px}.node:not(:last-child):after{content:'→';position:absolute;right:-28px;top:30px;color:#b4bfce;font-size:22px}.node-box{border:1px solid var(--line);border-top:3px solid var(--blue);border-radius:12px;padding:13px 12px;background:var(--surface2);height:104px}.node:nth-child(2) .node-box{border-top-color:#4b8cff}.node:nth-child(3) .node-box{border-top-color:var(--amber)}.node:nth-child(4) .node-box{border-top-color:#ef8a35}.node:nth-child(5) .node-box{border-top-color:var(--purple)}.node:nth-child(6) .node-box{border-top-color:var(--green)}.node-name{font-weight:800;font-size:13px}.node-count{font-size:23px;font-weight:800;margin-top:7px}.node-rate{font-size:11px;color:var(--muted)}.node-drop{font-size:11px;color:var(--red);font-weight:700;margin-top:7px;cursor:pointer;border-radius:6px;padding:2px 6px;transition:.15s}.node-drop:hover{background:var(--red2);text-decoration:underline}.node-drop.disabled{color:var(--muted);cursor:default;pointer-events:none}.path-note{margin-top:16px;padding-top:13px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}.cols{display:grid;grid-template-columns:1.35fr .9fr;gap:14px}.panel{padding:20px}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.panel-head h3{font-size:14px;margin:0}.panel-head span{font-size:11px;color:var(--muted)}.bars{display:grid;gap:12px}.bar-row{display:grid;grid-template-columns:104px 1fr 44px;align-items:center;gap:10px;font-size:12px}.bar-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar-bg{height:9px;background:#edf0f5;border-radius:99px;overflow:hidden}.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#246bfe,#79a1ff)}.bar-value{text-align:right;font-weight:800}.issue{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.issue:last-child{border-bottom:0}.issue-name{font-weight:700;font-size:12px}.issue-sub{color:var(--muted);font-size:11px;margin-top:2px}.issue-num{text-align:right;font-weight:800;font-size:18px}.issue-num small{display:block;color:var(--red);font-size:10px}.filters{display:flex;gap:8px;align-items:center}.filters select{border:1px solid var(--line);border-radius:8px;background:#fff;padding:7px 9px;color:var(--ink);font-size:12px}.table-wrap{overflow:auto}.users{width:100%;border-collapse:collapse;min-width:820px}.users th{text-align:left;padding:10px 12px;background:var(--surface2);color:var(--muted);font-size:11px;font-weight:700;white-space:nowrap}.users td{padding:12px;border-bottom:1px solid var(--line);font-size:12px;white-space:nowrap}.users tr{cursor:pointer;transition:.15s}.users tbody tr:hover{background:#f8fbff}.status{display:inline-flex;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:700}.status.ok{background:var(--green2);color:var(--green)}.status.warn{background:var(--amber2);color:var(--amber)}.status.bad{background:var(--red2);color:var(--red)}.timeline{display:grid;gap:9px;max-height:430px;overflow:auto;padding-right:3px}.event{display:grid;grid-template-columns:74px 88px 1fr;gap:9px;align-items:start;border-left:2px solid #dce5f4;padding:1px 0 8px 12px}.event-time{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}.event-stage{font-size:11px;color:var(--blue);font-weight:700}.event-body{font-size:11px;color:#344054;word-break:break-all}.drawer{position:fixed;inset:0;background:#10182866;display:none;justify-content:flex-end;z-index:10}.drawer.open{display:flex}.drawer-card{width:min(650px,92vw);height:100%;background:#fff;padding:25px;overflow:auto;box-shadow:-18px 0 40px #10182822}.drawer-top{display:flex;justify-content:space-between;align-items:start;margin-bottom:20px}.drawer-top h2{margin:0;font-size:18px}.close{border:0;background:var(--surface2);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:18px}.empty{padding:26px;color:var(--muted);text-align:center;font-size:12px}.foot{margin-top:18px;color:var(--muted);font-size:11px;display:flex;justify-content:space-between}.source{color:var(--blue)}.reason-drawer .reason-head{background:var(--red2);border-radius:12px;padding:14px 16px;margin-bottom:16px}.reason-head h3{margin:0 0 4px;font-size:15px;color:var(--red)}.reason-head p{margin:0;font-size:11px;color:var(--muted)}.reason-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.reason-tag{display:inline-flex;border-radius:99px;padding:3px 8px;font-size:11px;font-weight:700}.reason-tag.r0{background:var(--red2);color:var(--red)}.reason-tag.r1{background:var(--amber2);color:var(--amber)}.reason-tag.r2{background:var(--blue2);color:var(--blue)}.reason-tag.r3{background:var(--green2);color:var(--green)}.reason-tag.r4{background:#f3f4f6;color:var(--muted)}.reason-table{width:100%;border-collapse:collapse}.reason-table th{text-align:left;padding:8px 10px;background:var(--surface2);color:var(--muted);font-size:10px;font-weight:700;border-bottom:1px solid var(--line)}.reason-table td{padding:10px;border-bottom:1px solid var(--line);font-size:11px;vertical-align:top}.reason-table tr{cursor:pointer;transition:.15s}.reason-table tbody tr:hover{background:#f8fbff}.reason-row-reason{font-weight:700;margin-bottom:2px}.reason-row-detail{color:var(--muted);font-size:10px}.click-hint{font-size:10px;color:var(--blue);font-weight:700;margin-top:3px}.event.highlight{border-left-color:var(--red);background:#fff8f7;border-radius:0 6px 6px 0}@media(max-width:980px){.app{padding:20px}.grid4{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.topbar{gap:15px;flex-direction:column}.meta{text-align:left}}
</style>
</head>
<body>
<div class="app" id="app"><div class="empty">正在加载真实行为数据…</div></div>
<div class="drawer" id="drawer"><div class="drawer-card"><div class="drawer-top"><div><div class="eyebrow">USER TIMELINE</div><h2 id="drawerTitle">用户行为时间线</h2></div><button class="close" id="close">×</button></div><div id="drawerMeta"></div><div class="timeline" id="timeline"></div></div></div>
<script>
const stageNames=['进入产品','内容探索','找歌选内容','录音准备','录音创作','编辑完成','互动关系'];
const reasonClassMap={'离开后七日内未恢复':'r0','反复尝试但仍未继续':'r0','当次中断后恢复':'r1','当日离开后跨日恢复':'r2','未产生下一阶段事件':'r3','原始事件不足，无法判定':'r4'};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const pct=(n,d)=>d?`${(n/d*100).toFixed(1)}%`:'—';
function statusClass(s){return s.includes('完成')?'ok':s.includes('恢复')?'warn':'bad'}
function render(d){const s=d.summary, users=d.users, sr=d.stageReasons||[];const stages=s.stageAgg;
// Build lookup: stage -> stageReason object
const srMap={};sr.forEach(x=>srMap[x.stage]=x);
document.getElementById('app').innerHTML=`
<header class="topbar"><div class="brand"><div class="brand-mark">回</div><div><div class="eyebrow">NEW USER EXPERIENCE / REAL DATA</div><h1>回森新用户行为路径健康看板</h1><p>设备级时间线 · 进入 / 离开 / 恢复 · 识别真实卡点</p></div></div><div class="meta"><div>观察窗口：<strong>2026.08.08 — 2026.08.14</strong></div><div>筛选口径：新设备 · 首日使用 ≥ 10 min</div><div class="pill">渠道字段未在源文档提供，未擅自分层</div></div></header>
<div class="grid4"><div class="card stat"><div class="stat-label">纳入设备 <span>样本</span></div><div class="stat-value blue">${s.sampleTotal}</div><div class="stat-foot">总览设备 24 个，符合时长门槛</div></div><div class="card stat"><div class="stat-label">七日事件 <span>原始记录</span></div><div class="stat-value">${s.eventTotal.toLocaleString()}</div><div class="stat-foot">覆盖 8.8—8.14 七个页签</div></div><div class="card stat"><div class="stat-label">主路径完成 <span>到达编辑/互动</span></div><div class="stat-value green">${users.filter(u=>u.reached['编辑完成']||u.reached['互动关系']).length}</div><div class="stat-foot">完成率 ${pct(users.filter(u=>u.reached['编辑完成']||u.reached['互动关系']).length,s.sampleTotal)}</div></div><div class="card stat"><div class="stat-label">当次未完成 <span>待关注</span></div><div class="stat-value amber">${users.filter(u=>!u.reached['编辑完成']&&!u.reached['互动关系']).length}</div><div class="stat-foot">其中 ${users.filter(u=>u.status.includes('恢复')).length} 个后续发生恢复</div></div></div>
<section class="section"><div class="section-title"><div><div class="tag">01 / PATH</div><h2>新用户承接路径</h2></div><p>点击「未继续」查看设备与原因</p></div><div class="card path"><div class="path-row">${stages.map((x,i)=>{const drop=x.nextReached<x.reached?x.reached-x.nextReached:0;const reason=srMap[x.stage];return`<div class="node"><div class="node-box"><div class="node-name">${esc(x.stage)}</div><div class="node-count">${x.reached}<small style="font-size:12px;color:var(--muted)"> / ${s.sampleTotal}</small></div><div class="node-rate">到达率 ${x.rate}%</div></div>${i<stages.length-1?`<div class="node-drop${drop?'':' disabled'}" data-stage="${esc(x.stage)}">${drop?`−${drop} 未继续 ›`:''}</div>`:''}</div>`}).join('')}</div><div class="path-note">路径按业务阶段归一化。点击红色「未继续」数字可查看具体设备未继续的原因和证据。</div></div></section>
<section class="section cols"><div class="card panel"><div class="panel-head"><h3>各阶段到达设备</h3><span>分母：${s.sampleTotal} 个设备</span></div><div class="bars">${stages.map(x=>`<div class="bar-row"><div class="bar-label">${esc(x.stage)}</div><div class="bar-bg"><div class="bar-fill" style="width:${x.rate}%"></div></div><div class="bar-value">${x.reached}</div></div>`).join('')}</div></div><div class="card panel"><div class="panel-head"><h3>卡点候选排行</h3><span>离开事件 + 未继续</span></div><div>${sr.filter(x=>x.notContinued>0).sort((a,b)=>b.notContinued-a.notContinued).map(x=>`<div class="issue" style="cursor:pointer" data-stage-issue="${esc(x.stage)}"><div><div class="issue-name">${esc(x.stage)} → ${esc(x.nextStage)}</div><div class="issue-sub">${x.notContinued} 个设备未继续 · ${Object.entries(x.reasonCounts).map(([k,v])=>`${k} ${v}`).join('、')}</div></div><div class="issue-num">${x.notContinued}<small>未继续设备 ›</small></div></div>`).join('')||'<div class="empty">暂无卡点数据</div>'}</div></div></section>
<section class="section"><div class="section-title"><div><div class="tag">02 / USERS</div><h2>设备级行为明细</h2></div><div class="filters"><select id="statusFilter"><option value="all">全部状态</option><option value="完成">完成</option><option value="恢复">恢复</option><option value="卡住">未完成</option></select><select id="stageFilter"><option value="all">全部最后节点</option>${stageNames.map(x=>`<option>${x}</option>`).join('')}</select></div></div><div class="card panel table-wrap"><table class="users"><thead><tr><th>设备 UID</th><th>首日时长</th><th>七日事件</th><th>最后到达节点</th><th>最终状态</th><th>日期覆盖</th></tr></thead><tbody id="userRows"></tbody></table></div></section><div class="foot"><span>数据说明：${esc(s.channelNote)} · 未归类事件 ${s.unknownEvents.toLocaleString()} 条</span><span class="source">真实明细快照 · analysis.json</span></div>`;
// Bind path node drop clicks
document.querySelectorAll('.node-drop[data-stage]').forEach(el=>{if(!el.classList.contains('disabled'))el.onclick=()=>openReason(srMap[el.dataset.stage],users)});
// Bind issue row clicks
document.querySelectorAll('[data-stage-issue]').forEach(el=>{el.onclick=()=>openReason(srMap[el.dataset.stageIssue],users)});
const rows=document.getElementById('userRows');function fill(){const sf=document.getElementById('statusFilter').value,tf=document.getElementById('stageFilter').value;const list=users.filter(u=>(sf==='all'||(sf==='完成'?u.status.includes('完成'):sf==='恢复'?u.status.includes('恢复'):!u.status.includes('完成')&&!u.status.includes('恢复')))&&(tf==='all'||u.lastStage===tf));rows.innerHTML=list.map(u=>`<tr data-uid="${u.uid}"><td><strong>${u.uid}</strong></td><td>${u.durationMin} min</td><td>${u.events.toLocaleString()}</td><td>${esc(u.lastStage)}</td><td><span class="status ${statusClass(u.status)}">${esc(u.status)}</span></td><td>${u.dates.join('、')}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">没有符合条件的设备</td></tr>';rows.querySelectorAll('tr[data-uid]').forEach(r=>r.onclick=()=>openUser(users.find(u=>u.uid===r.dataset.uid)));}fill();document.getElementById('statusFilter').onchange=fill;document.getElementById('stageFilter').onchange=fill;}
function openReason(reasonData,users){if(!reasonData)return;const r=reasonData;document.getElementById('drawerTitle').textContent=`${r.stage} → ${r.nextStage}：未继续原因`;document.getElementById('drawerMeta').innerHTML=`<div class="reason-drawer"><div class="reason-head"><h3>${r.notContinued} 个设备到达「${r.stage}」后未继续到「${r.nextStage}」</h3><p>分母：${r.reached} 个设备到达此阶段 · 判定规则基于离开事件、恢复事件、重复进入和后续日期活动</p></div><div class="reason-tags">${Object.entries(r.reasonCounts).map(([k,v])=>`<span class="reason-tag ${reasonClassMap[k]||'r4'}">${esc(k)} ×${v}</span>`).join('')}</div><table class="reason-table"><thead><tr><th>设备 UID</th><th>原因</th><th>最后事件</th><th>离开次数</th><th>恢复</th><th>后续活跃</th></tr></thead><tbody>${r.users.map(u=>`<tr data-uid="${u.uid}"><td><strong>${u.uid}</strong></td><td><div class="reason-row-reason"><span class="reason-tag ${reasonClassMap[u.reason]||'r4'}" style="font-size:10px;padding:2px 6px">${esc(u.reason)}</span></div><div class="reason-row-detail">${esc(u.lastPage)}</div></td><td>${u.lastDate.slice(5)}<br>${u.lastTime}</td><td>${u.exits}</td><td>${u.hasRecovery?'✓':'—'}</td><td>${u.laterActivity?'✓':'—'}</td></tr>`).join('')}</tbody></table><div class="click-hint" style="margin-top:10px">点击设备行 → 查看完整七日行为时间线</div></div>`;
document.getElementById('timeline').innerHTML='';document.getElementById('drawer').classList.add('open');
// Bind reason table row clicks to user timeline
document.querySelectorAll('.reason-table tr[data-uid]').forEach(el=>{el.onclick=()=>{const u=users.find(x=>x.uid===el.dataset.uid);if(u)openUser(u)}})}
function openUser(u){document.getElementById('drawerTitle').textContent=`${u.uid} · 行为时间线`;document.getElementById('drawerMeta').innerHTML=`<div class="grid4" style="grid-template-columns:repeat(3,1fr);margin-bottom:18px"><div><div class="stat-label">首日时长</div><strong>${u.durationMin} min</strong></div><div><div class="stat-label">七日事件</div><strong>${u.events.toLocaleString()}</strong></div><div><div class="stat-label">状态</div><span class="status ${statusClass(u.status)}">${esc(u.status)}</span></div></div>`;document.getElementById('timeline').innerHTML=u.timeline.map(e=>`<div class="event"><div class="event-time">${e.date.slice(5)}<br>${e.time.slice(0,8)}</div><div class="event-stage">${esc(e.stage)}<br><span style="color:var(--muted);font-weight:500">${e.role}</span></div><div class="event-body">${esc(e.body)}</div></div>`).join('');document.getElementById('drawer').classList.add('open')}
document.getElementById('close').onclick=()=>document.getElementById('drawer').classList.remove('open');document.getElementById('drawer').onclick=e=>{if(e.target.id==='drawer')e.currentTarget.classList.remove('open')};
fetch('analysis.json').then(r=>r.json()).then(render).catch(e=>{document.getElementById('app').innerHTML='<div class="card empty">无法加载 analysis.json，请通过本地静态服务器打开看板。</div>';console.error(e)});
</script>
</body></html>

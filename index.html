const subLabel={'进入产品/登录与资料完善':'登录与资料完善','进入产品/进入首页':'进入首页','探索内容/首页Feed':'首页Feed','探索内容/搜索':'搜索','探索内容/点歌/选歌':'点歌选歌','探索内容/个人主页':'个人主页','探索内容/他人主页':'他人主页','探索内容/内容浏览':'内容浏览','首次互动/点赞':'点赞','首次互动/评论':'评论','首次互动/关注':'关注','首次互动/进房':'进房','首次互动/播放':'播放','首次互动/送礼':'送礼','首次互动/其他互动':'其他互动','首次创作/录音准备':'录音准备','首次创作/录音':'录音','首次创作/编辑':'编辑','首次创作/发布':'发布','首次创作/创作流程':'创作流程'};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const pct=(n,d)=>d?`${(n/d*100).toFixed(1)}%`:'—';
function statusClass(s){return s.includes('完成')?'ok':s.includes('回来')?'warn':'bad'}
function statusLabel(s){return s==='当次中断后恢复'?'回来过当前阶段，但仍未完成下一步':s}
function inferenceFor(item,stage,next){
  const later=(item.laterBehaviorSummary||'').toLowerCase();
  const rel=Object.entries(item.laterRelationshipCounts||{});
  const relTotal=rel.reduce((sum,x)=>sum+x[1],0);
  const lowTime=Number(item.durationMin||0)<5;
  if(item.reason==='离开后七日内未回来'&&lowTime)return {key:'low-investment',title:'浅尝后离开',text:'首日使用时间较短，用户可能还没有形成明确兴趣或使用习惯。',evidence:`首日仅 ${item.durationMin} 分钟，且观察期内没有再次回来`,suggestion:['优化新用户首屏引导，3 秒内给出明确价值主张','基于首日行为细分人群，次日推送个性化 push 召回','尝试通过免费礼物/金币激励机制提升首日停留']};
  if(stage==='形成关系'&&relTotal>0&&item.laterActivity)return {key:'weak-relationship',title:'有关系行为，但没有形成持续联系',text:'用户做过私信、关注或社交玩法，但后续行为没有转化为下一次回来，可能是关系连接较弱、互动没有得到回应，或缺少继续联系的理由。',evidence:`形成关系相关行为 ${relTotal} 次；${item.laterEventCount||0} 条后续事件仍未带来下一次回来`,suggestion:['在关系建立后主动推 “对方回复了你” 类反馈，加强回访动机','强化亲密度/关系专属表情等深度社交钩子','降低首次私信门槛，避免互动得不到回应的挫败感']};
  if(stage==='形成关系'&&/探索内容|首次创作/.test(later))return {key:'other-preference',title:'兴趣停留在浏览或创作，没有继续社交',text:'用户后续仍在浏览内容或尝试创作，但没有继续关系行为，可能更偏好内容消费或创作，而不是社交关系。',evidence:'后续行为主要是浏览内容/创作，未看到持续的关系行为',suggestion:['区分“内容型/社交型”用户，避免对内容型用户过度推社交玩法','对创作偏好用户强化作品被互动反馈，走“创作-被互动-关系”链路','在作品消费场景顺滑引入社交入口（如作品评论区互动引导）']};
  if(item.reason==='未产生下一阶段事件'&&item.laterActivity)return {key:'same-day-stop',title:'仍在使用，但卡在当前阶段',text:`用户之后还有行为，却没有完成“${next}”，可能是当前入口不够清晰、下一步价值不明显，或用户选择了另一条使用路径。`,evidence:`之后仍有 ${item.laterEventCount||0} 条事件，但没有进入“${next}”`,suggestion:['在当前阶段完成后高亮下一步入口（如发布成功后引导关注/进房）','检查下一步触发时机是否与用户意图匹配','A/B 测试不同引导时机与文案']};
  if(item.reason==='隔天回来，但仍未进入下一步')return {key:'revisit-no-convert',title:'回来过，但没有完成下一步',text:'用户有回访或重复浏览，说明不是完全没有兴趣；但回访后仍未转化，可能是核心价值没有被理解，或下一步触发时机不合适。',evidence:`回来后仍有 ${item.reEntries||0} 次当前阶段行为，但没有进入“${next}”`,suggestion:['用户回访时重推未完成路径的进度提醒','针对性 push “你昨天没完成 X，继续吗”','检查回访后首屏是否是用户预期场景']};
  return {key:'unclear',title:'行为证据不足，暂时无法判断',text:'当前事件能确认用户没有进入下一阶段，但不足以判断具体动机，需要结合访谈、问卷或更多样本验证。',evidence:'仅依据埋点行为推测，不能等同于用户真实原因',suggestion:['补充定性访谈/问卷验证真实原因','扩大样本量重新观察模式','结合用户反馈后台查看是否有主动反馈']};
}
// 单设备行为分析（模仿人工分析的“行为特征 + 行为分析 + 优化建议”）
function userAnalysis(u,stages){
  if(!u||!u.timeline)return {feature:'无时间线数据',analysis:'无法分析',suggestion:[]};
  const tl=u.timeline;
  const reached=u.reached||{};
  const totalEvents=tl.length;
  const duration=Number(u.durationMin||0);
  const stageCount={};
  const subCount={};
  tl.forEach(e=>{stageCount[e.stage]=(stageCount[e.stage]||0)+1;if(e.subStage)subCount[e.subStage]=(subCount[e.subStage]||0)+1});
  const topStages=Object.entries(stageCount).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const topSubs=Object.entries(subCount).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const firstEv=tl[0], lastEv=tl[tl.length-1];
  const sameDay=firstEv&&lastEv&&firstEv.date===lastEv.date;
  const stageOrder=['进入产品','探索内容','首次互动','首次创作','形成关系','后续回来'];
  const reachedList=stageOrder.filter(s=>reached[s]);
  const notReachedList=stageOrder.filter(s=>!reached[s]);
  const lastReached=reachedList[reachedList.length-1]||'—';
  // 特征描述
  const features=[];
  if(duration<5)features.push(`首日仅 ${duration} 分钟，属于浅度体验`);
  else if(duration>60)features.push(`首日 ${duration} 分钟，使用深度较高`);
  else features.push(`首日 ${duration} 分钟，中等使用`);
  if(sameDay)features.push(`仅激活当日有行为，观察窗内未回访`);else features.push(`跨多日活跃，有回访行为`);
  if(topStages[0])features.push(`主要场景：${topStages[0][0]}（${topStages[0][1]} 条事件）`);
  if(topStages[1])features.push(`次要场景：${topStages[1][0]}（${topStages[1][1]} 条）`);
  // 分析
  const analysis=[];
  if(!reached['后续回来']){
    if(!reached['形成关系'])analysis.push(`卡点在「形成关系」之前——未发生关注/私信/社交玩法等关系行为`);
    else analysis.push(`已形成关系但未回访——关系连接较弱，缺少下次回来的动机`);
  }else{
    analysis.push(`已回访，但需关注是否形成持续留存`);
  }
  // 创作环节深度判断
  const createEvents=stageCount['首次创作']||0;
  const publishEvents=subCount['发布']||0;
  const recordEvents=subCount['录音']||0;
  if(createEvents>0&&publishEvents===0){
    analysis.push(`进入创作流程 ${createEvents} 次，录音 ${recordEvents} 次，但未发布作品——可能是录制效果不达标或发布动力不足`);
  }
  if(recordEvents>=3&&publishEvents===0){
    analysis.push(`反复录制 ${recordEvents} 次仍不发布，建议在重录时引导修音功能或提供草稿箱暂存提示`);
  }
  // 互动环节
  const likeEvents=subCount['点赞']||0;
  const commentEvents=subCount['评论']||0;
  const followEvents=subCount['关注']||0;
  const roomEvents=subCount['进房']||0;
  if(likeEvents===0&&commentEvents===0&&followEvents===0&&roomEvents===0){
    analysis.push(`首日未发生任何互动行为（点赞/评论/关注/进房），内容消费未转化为社交参与`);
  }
  // 优化建议
  const suggestion=[];
  if(!reached['后续回来']){
    suggestion.push('次日推送个性化 push 召回，基于首日行为细分人群');
    if(createEvents>0&&publishEvents===0){suggestion.push('在录制环节引导修音功能，或提示草稿箱有未发布作品');suggestion.push('通过 UI/视觉优化金币价值说明，提升首发动力')}
    if(likeEvents===0&&commentEvents===0&&followEvents===0){suggestion.push('在内容消费场景顺滑引入互动引导（如右滑点赞、双击关注）')}
  }
  if(reached['后续回来']&&!reached['形成关系']){suggestion.push('在互动场景强化关注引导，推动从消费型转向关系型')}
  if(sameDay&&duration<5){suggestion.push('优化新用户首屏价值传达，3 秒内明确产品核心场景')}
  if(recordEvents>=3&&publishEvents===0){suggestion.push('反复重录时提示修音功能；草稿箱保留未发布作品并二次触达')}
  if(suggestion.length===0)suggestion.push('暂无特别优化建议，建议扩大样本观察模式');
  return {
    feature:features.join('；'),
    analysis:analysis.join('；'),
    suggestion,
    evidence:{totalEvents,duration,topStages,topSubs,lastReached,sameDay,stageCount,subCount}
  };
}
function inferenceGroups(items,stage,next){const groups={};items.forEach(item=>{const x=inferenceFor(item,stage,next);if(!groups[x.key])groups[x.key]={...x,items:[]};groups[x.key].items.push(item)});return Object.values(groups)}
function compactEvidence(item,stage,next){const x=inferenceFor(item,stage,next);return `<div class="compact-evidence" data-uid="${esc(item.uid)}"><div class="compact-main"><strong>${esc(item.uid)}</strong><span>${esc(item.durationMin)} min</span><span class="compact-last">最后：${esc(item.lastPage||'未识别')}</span></div><div class="compact-detail">${esc(x.evidence)} · 最后停留：${esc(item.lastDate.slice(5))} ${esc(item.lastTime)}</div><div class="compact-link">点击查看完整时间线 →</div></div>`}

const firstInteraction=stageRate('首次互动'), firstCreate=stageRate('首次创作'), relation=stageRate('形成关系'), returned=stageRate('后续回来');
const score=Math.round((firstInteraction+firstCreate+relation+returned)/4);
const healthState=score>=75?'整体健康':score>=55?'结果合格，过程需关注':'全面需改善';
const scoreReason=score>=75?['首次互动、创作和关系形成均达到主要链路目标','后续回来率仍是最需要持续观察的结果指标','当前样本为 24 个设备，结论适用于本次观察期']:score>=55?['前置互动与创作链路已有基础，但回访转化偏低','形成关系后只有 41.7% 设备在观察期内回来','需要优先验证关系行为是否形成持续使用理由']:['核心链路多个阶段转化不足','结果与过程均存在明显流失风险','建议补充更稳定的日常样本后再做长期判断'];
// Sub-stages per primary stage from user data
const stageSubs={};
users.forEach(u=>{(u.subReached||[]).forEach(k=>{const[primary,sub]=k.split('/');if(!stageSubs[primary])stageSubs[primary]=new Set();stageSubs[primary].add(sub)})});
// Retention calculation from real data
const pd=s=>{const p=s.split('/');return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]))};
const wEnd=pd('2026/8/14');
function calcRetention(days){let total=0,retained=0;users.forEach(u=>{const act=pd(u.firstDate);const allD=new Set(u.dates.map(d=>pd(d).getTime()));const target=new Date(act);target.setDate(target.getDate()+days);if(target<=wEnd){total++;if(allD.has(target.getTime()))retained++}});return{retained,total,rate:total?(retained/total*100).toFixed(1):'—'}}
const d1=calcRetention(1),d3=calcRetention(3),d7=calcRetention(7);

document.getElementById('app').innerHTML=`
<header class="health-header"><section class="health-card"><div class="health-head"><h2>新用户链路整体健康度</h2><span class="health-badge">● ${healthState}</span></div><div class="health-body"><div class="health-score"><div><small>当前参考评分</small><strong>${score}</strong><em>/ 100</em></div></div><div class="health-conclusion"><h3>当前判定</h3><ol>${scoreReason.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div></div><div class="health-foot">评分规则：按“核心目标达成 + 任务完成效率 + 体验摩擦 + 用户满意”综合观察；当前页面以链路转化作为可量化快照，行业水位和性能红线暂无数据，不参与本次评分。</div></section><section class="metrics-card"><div class="metrics-head"><h2>核心指标</h2><span>HEART+GSM · 24 个新设备样本</span></div><div class="metric-grid"><div class="metric-card"><div class="metric-label">首次关键行为完成率</div><div class="metric-value">${Math.max(firstInteraction,firstCreate).toFixed(1)}%</div><div class="metric-note">新用户中完成任一关键行为的比例（首次互动 / 首次创作）</div><span class="metric-state">当前样本快照</span></div><div class="metric-card"><div class="metric-label">次留 (D+1)</div><div class="metric-value">${d1.rate}%</div><div class="metric-note">${d1.retained} / ${d1.total} 个设备次日回访</div><span class="metric-state">样本计算值</span></div><div class="metric-card"><div class="metric-label">7日留存 (D+7)</div><div class="metric-value">${d7.total?d7.rate+'%':'N/A'}</div><div class="metric-note">${d7.total?d7.retained+' / '+d7.total+' 个设备第7日回访':'观察期不足，暂无法计算'}</div><span class="metric-state${d7.total?'':' muted'}">${d7.total?'样本计算值':'观察期不足'}</span></div><div class="metric-card"><div class="metric-label">有效消费渗透</div><div class="metric-value">${firstInteraction.toFixed(1)}%</div><div class="metric-note">新用户中产生有效播放 / 有效浏览的比例</div><span class="metric-state">当前样本快照</span></div><div class="metric-card"><div class="metric-label">首次发布率</div><div class="metric-value">${firstCreate.toFixed(1)}%</div><div class="metric-note">${stages.find(x=>x.stage==='首次创作')?.reached||0} / 24 个设备完成首次创作发布</div><span class="metric-state">当前样本快照</span></div><div class="metric-card"><div class="metric-label">推荐页到达率</div><div class="metric-value">—</div><div class="metric-note">新用户激活后推荐页到达率，需增长看板接入</div><span class="metric-state muted">待接入</span></div><div class="metric-card"><div class="metric-label">首次关键行为耗时</div><div class="metric-value">—</div><div class="metric-note">从进入到首次关键行为的耗时，需补充埋点</div><span class="metric-state muted">待接入</span></div><div class="metric-card"><div class="metric-label">行为有效操作步骤</div><div class="metric-value">—</div><div class="metric-note">核心功能有效操作步骤数，需补充埋点</div><span class="metric-state muted">待接入</span></div><div class="metric-card"><div class="metric-label">有效播放时长</div><div class="metric-value">—</div><div class="metric-note">新用户有效播放时长，需增长看板接入</div><span class="metric-state muted">待接入</span></div></div></section></header>

function fill(){const sf=document.getElementById('statusFilter').value,tf=document.getElementById('stageFilter').value;
const list=users.filter(u=>(sf==='all'||(sf==='完成'?u.status.includes('完成'):sf==='回来'?u.status.includes('回来'):!u.status.includes('完成')&&!u.status.includes('回来')))&&(tf==='all'||u.lastStage===tf));
rows.innerHTML=list.map(u=>`<tr data-uid="${u.uid}"><td><strong>${u.uid}</strong></td><td>${u.durationMin} min</td><td>${u.events.toLocaleString()}</td><td>${esc(u.lastStage)}</td><td><span class="status ${statusClass(u.status)}">${esc(statusLabel(u.status))}</span></td><td>${u.dates.join('、')}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">没有符合条件的设备</td></tr>';
rows.querySelectorAll('tr[data-uid]').forEach(r=>r.onclick=()=>openUser(users.find(u=>u.uid===r.dataset.uid)));}
fill();document.getElementById('statusFilter').onchange=fill;document.getElementById('stageFilter').onchange=fill;}

function openStageDetail(stage){
const stages=_stages,srMap=_srMap,users=_users;
const d=stages.find(x=>x.stage===stage);if(!d)return;
const total=24;
const imap={
'进入产品':{goal:'了解回森是什么',criteria:'必要弹窗同意、关键内容触达、有效停留',metrics:'弹窗确认率、分层用户目标触达、App退出率、App停留时长',desc:'设备完成功能引导、登录/注册或首页到达等核心启动行为，即视为已「进入产品」。本阶段是漏斗分母，所有样本设备均计入。',subs:['功能引导','登录与资料完善','系统启动','进入首页']},
'探索内容':{goal:'找到感兴趣的内容或场景',criteria:'内容点击、有效浏览、有效播放',metrics:'人均播放次数、播放时长、有效播放渗透',desc:'进入产品后，发生内容浏览、Feed 滚动、点歌选歌、个人/他人主页访问等探索类事件，即视为完成「探索内容」。',subs:['首页Feed','搜索','点歌/选歌','个人主页','他人主页','内容浏览']},
'首次互动':{goal:'点赞、评论、关注、进入歌房等',criteria:'有效互动渗透率',metrics:'首次进房率、点赞渗透率、评论渗透率、双关渗透率',desc:'首次发生点赞、评论、关注、进房、播放、送礼等社交或互动类事件，即视为完成「首次互动」。',subs:['关注','点赞','评论','进房','播放','送礼','其他互动']},
'首次创作':{goal:'找歌、录制、编辑、发布',criteria:'有效发布率、完成耗时',metrics:'开口发布UV、首次发布耗时',desc:'首次进入创作流程，包含录音准备、录音、编辑或发布等创作事件中任一步骤，即视为完成「首次创作」。',subs:['创作流程','录音','录音准备','编辑','发布']},
'形成关系':{goal:'获得回应、关注或再次互动',criteria:'首次回应率、二次互动率',metrics:'双关渗透率、首次作品被互动率、回关率',desc:'发生社交玩法、私信或关注等关系建立行为，视为与产品或其他用户形成了初步社交联系。',subs:['社交玩法','私信','关注']},
'后续回来':{goal:'继续使用产品',criteria:'次日/3日留存',metrics:'次留、3日留存',desc:'在首次激活当日之后，观察期（2026.08.08—2026.08.14）内有过至少一次访问记录，即视为「后续回来」。',subs:[],special:true}
};
const info=imap[stage]||{desc:'暂无说明',subs:[],goal:'—',criteria:'—',metrics:'—'};
const reached=users.filter(u=>u.reached[stage]);
const notReached=users.filter(u=>!u.reached[stage]);
const sr=srMap[stage];
const cc=d.rate>=80?'green':d.rate>=50?'amber':'red';
const specialBlock=info.special?(()=>{const r1=calcRetention(1),r3=calcRetention(3);return`<div class="se-special"><div class="se-special-title">⚠ 留存与回访口径对比</div><div class="se-special-body"><table style="width:100%;border-collapse:collapse;font-size:11px;margin-bottom:10px"><thead><tr style="background:var(--surface2)"><th style="padding:7px 10px;text-align:left;font-weight:700;color:var(--muted)">指标</th><th style="padding:7px 10px;text-align:left;font-weight:700;color:var(--muted)">口径</th><th style="padding:7px 10px;text-align:center;font-weight:700;color:var(--muted)">值</th></tr></thead><tbody><tr style="border-bottom:1px solid var(--line)"><td style="padding:8px 10px;font-weight:800;color:var(--blue)">次留 (D+1)</td><td style="padding:8px 10px;color:var(--muted)">激活次日是否有访问</td><td style="padding:8px 10px;text-align:center;font-weight:800;color:var(--ink)">${r1.rate}% <span style="color:var(--muted);font-weight:400">(${r1.retained}/${r1.total})</span></td></tr><tr style="border-bottom:1px solid var(--line)"><td style="padding:8px 10px;font-weight:800;color:var(--amber)">3日留存 (D+3)</td><td style="padding:8px 10px;color:var(--muted)">激活第3日是否有访问</td><td style="padding:8px 10px;text-align:center;font-weight:800;color:var(--ink)">${r3.rate}% <span style="color:var(--muted);font-weight:400">(${r3.retained}/${r3.total})</span></td></tr><tr><td style="padding:8px 10px;font-weight:800;color:var(--purple)">窗内回访率</td><td style="padding:8px 10px;color:var(--muted)">观察期内任意后续日有访问</td><td style="padding:8px 10px;text-align:center;font-weight:800;color:var(--purple)">${d.rate}% <span style="color:var(--muted);font-weight:400">(${d.reached}/${total})</span></td></tr></tbody></table><div style="font-size:10px;color:var(--muted);line-height:1.6">窗内回访率口径更宽松（任意后续日即可），因此数值 ≥ 次留。次留/3日留存要求精确到某一天有访问。</div></div></div>`})():'';
let exPan=document.getElementById('stageExpand');
if(exPan&&exPan.dataset.stage===stage){exPan.remove();document.querySelectorAll('.node-box.active').forEach(n=>n.classList.remove('active'));return}
if(exPan)exPan.remove();
document.querySelectorAll('.node-box.active').forEach(n=>n.classList.remove('active'));
const nb=document.querySelector('.node-box[data-stage-detail="'+stage+'"]');if(nb)nb.classList.add('active');
const criteriaGrid=info.criteria.split('、').map(c=>`<div class="se-goal"><div class="se-goal-label">成功标准</div><div class="se-goal-value">${esc(c)}</div></div>`).join('');
exPan=document.createElement('div');exPan.id='stageExpand';exPan.className='stage-expand';exPan.dataset.stage=stage;
exPan.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div><div class="reason-kicker">阶段定义</div><p style="font-size:13px;line-height:1.7;color:var(--ink);margin:6px 0 0">${esc(info.desc)}</p></div><button onclick="document.getElementById('stageExpand').remove();document.querySelectorAll('.node-box.active').forEach(n=>n.classList.remove('active'))" style="border:none;background:none;cursor:pointer;font-size:18px;color:var(--muted);padding:4px 8px;border-radius:8px;transition:.15s" onmouseover="this.style.background='var(--surface2)'" onmouseout="this.style.background='none'">×</button></div>${specialBlock}<div style="margin-top:12px"><div style="font-size:10px;font-weight:700;color:var(--muted);margin-bottom:6px">用户要完成什么</div><div class="se-goal"><div class="se-goal-value">${esc(info.goal)}</div></div></div><div style="margin-top:12px"><div style="font-size:10px;font-weight:700;color:var(--muted);margin-bottom:6px">成功标准</div><div class="se-criteria">${criteriaGrid}</div></div><div class="se-metrics" style="margin-top:12px"><div class="se-goal-label">具体数据指标</div><div class="se-goal-value" style="color:var(--blue)">${esc(info.metrics)}</div></div><div class="se-caliber" style="margin-top:14px"><div><span>到达设备</span><strong class="${cc}">${d.reached}</strong></div><div><span>到达率</span><strong class="${cc}">${d.rate}%</strong></div><div><span>计算口径</span><strong style="font-size:11px">${d.reached} ÷ ${total} = ${d.rate}%</strong></div></div>${info.subs.length?`<div class="se-subs" style="margin-top:12px"><div class="se-subs-label">该阶段细分行为</div><div class="se-subs-list">${info.subs.map(s=>`<span>${esc(s)}</span>`).join('')}</div></div>`:''}<div class="se-devices"><div class="se-dev-label">✓ 到达本阶段 · ${reached.length} 个设备</div><div class="se-dev-list">${reached.map(u=>`<span class="reason-tag r3" style="cursor:pointer" data-uid="${esc(u.uid)}">${esc(u.uid)}</span>`).join('')}</div></div>${notReached.length?`<div class="se-devices" style="margin-top:10px"><div class="se-dev-label">✗ 未到达 · ${notReached.length} 个设备</div><div class="se-dev-list">${notReached.map(u=>`<span class="reason-tag r0" style="cursor:pointer" data-uid="${esc(u.uid)}">${esc(u.uid)}</span>`).join('')}</div></div>`:''}${sr&&sr.notContinued>0?`<div class="se-drop-link" id="seDropLink">${sr.notContinued} 个设备到达「${esc(stage)}」后未进入「${esc(sr.nextStage)}」· 查看原因分析 →</div>`:''}`;
const pathCard=document.querySelector('.card.path');
pathCard.appendChild(exPan);
exPan.querySelectorAll('[data-uid]').forEach(el=>{el.onclick=e=>{e.stopPropagation();const u=users.find(x=>x.uid===el.dataset.uid);if(u)openUser(u)}});
const dl=document.getElementById('seDropLink');if(dl&&sr)dl.onclick=()=>{openReason(sr,users)};
exPan.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function openReason(reasonData,users){if(!reasonData)return;const r=reasonData;const groups=inferenceGroups(r.users,r.stage,r.nextStage);const noReturn=r.stage==='形成关系'&&r.nextStage==='后续回来';
document.getElementById('drawerTitle').textContent=`${r.stage} → ${r.nextStage}：为什么没有继续？`;
document.getElementById('drawerMeta').innerHTML=`<div class="reason-drawer"><div class="reason-head"><div class="reason-kicker">结论先看</div><h3>${r.notContinued} 个设备到达「${r.stage}」后没有进入「${r.nextStage}」</h3><p>${noReturn?'这批用户不是完全没有使用，而是形成关系后没有产生下一次回来。下面按行为特征给出可能原因。':'下面先看可能原因，再看对应设备；点击设备可以查看完整时间线。'}</p></div><div class="ai-analysis-card"><div class="ai-analysis-head"><div class="ai-kicker">● AI 卡点分析</div><span>基于 ${r.users.length} 个设备的埋点行为生成，不是用户明确反馈</span></div><div class="ai-analysis-body"><div class="ai-analysis-label">整体卡点定位</div><p>${r.stage==='形成关系'&&r.nextStage==='后续回来'?'卡点出现在链路末端：用户已完成关系建立，但未转化为下次回访。这不是“使用不顺”问题，而是“回来动机不足”问题。':'卡点出现在「'+esc(r.stage)+'」→「'+esc(r.nextStage)+'」这一步。用户已通过前置阶段，但在进入下一步时失败，说明问题集中在下一步的入口/价值/时机。'}</p><div class="ai-analysis-label" style="margin-top:12px">可能原因分组与优化建议</div>${groups.map((g,i)=>`<div class="ai-group"><div class="ai-group-head"><div><span class="ai-idx">0${i+1}</span><strong>${esc(g.title)}</strong></div><b>${g.items.length} 个</b></div><p class="ai-group-text">${esc(g.text)}</p><div class="ai-suggestion"><div class="ai-sug-label">▸ 优化建议</div><ul>${g.suggestion.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div><div class="ai-evidence"><div class="ai-evid-label">▸ 行为证据</div><div class="ai-evid-body">${esc(g.evidence)}</div></div></div>`).join('')}</div></div><div class="reason-summary"><div><span>未继续</span><strong>${r.notContinued}</strong></div><div><span>主要原因</span><strong>${esc(groups[0]?.title||'暂无法判断')}</strong></div><div><span>可确认事实</span><strong>${r.users.filter(x=>x.laterActivity).length} 个之后仍有行为</strong></div></div><div class="inference-groups">${groups.map((g,i)=>`<section class="inference-group"><div class="inference-group-head"><div><span class="inference-index">0${i+1}</span><strong>${esc(g.title)}</strong><p>${esc(g.text)}</p></div><b>${g.items.length} 个</b></div><div class="inference-evidence">${g.items.map(u=>compactEvidence(u,r.stage,r.nextStage)).join('')}</div></section>`).join('')}</div><details class="raw-details"><summary>需要时再看：原始判定明细（${r.users.length} 个设备）</summary><table class="reason-table"><thead><tr><th>设备</th><th>判定原因</th><th>最后行为</th><th>后续行为</th><th>回来过当前阶段</th></tr></thead><tbody>${r.users.map(u=>`<tr data-uid="${u.uid}"><td><strong>${u.uid}</strong></td><td><span class="reason-tag ${reasonClassMap[u.reason]||'r4'}">${esc(u.reason)}</span></td><td>${esc(u.lastDate.slice(5))}<br>${esc(u.lastTime)}<br><small>${esc(u.lastPage)}</small></td><td>${u.laterEventCount?`${u.laterEventCount} 条<br><small>${esc(u.laterBehaviorSummary||'')}</small>`:'无'}</td><td>${u.hasRecovery?'✓ 回到本阶段':'— 没回来'}</td></tr>`).join('')}</tbody></table></details></div>`;
document.getElementById('timeline').innerHTML='';document.getElementById('drawer').classList.add('open');
document.querySelectorAll('.reason-table tr[data-uid], .compact-evidence').forEach(el=>{el.onclick=()=>{const u=users.find(x=>x.uid===el.dataset.uid);if(u)openUser(u)}})}

function openUser(u){document.getElementById('drawerTitle').textContent=`${u.uid} · 行为时间线`;
const ua=userAnalysis(u);
const reachedList=Object.entries(u.reached||{}).filter(([k,v])=>v).map(([k])=>k);
document.getElementById('drawerMeta').innerHTML=`<div style="margin-bottom:14px"><div class="stat-label">首日时长</div><strong>${u.durationMin} min</strong></div><div style="margin-bottom:14px"><div class="stat-label">到达阶段</div><div class="sub-grid">${reachedList.map(k=>`<span class="sub-tag">${esc(k)}</span>`).join('')}</div></div><div style="margin-bottom:14px"><div class="stat-label">状态</div><span class="status ${statusClass(u.status)}">${esc(statusLabel(u.status))}</span></div><div style="margin-bottom:8px"><div class="stat-label">七日事件</div><strong>${u.events.toLocaleString()}</strong></div><div class="ai-analysis-card" style="margin-top:16px"><div class="ai-analysis-head"><div class="ai-kicker">● AI 行为分析</div><span>基于 ${u.events.toLocaleString()} 条埋点事件生成</span></div><div class="ai-analysis-body"><div class="ai-analysis-label">行为特征</div><p>${esc(ua.feature)}</p><div class="ai-analysis-label" style="margin-top:10px">卡点定位与行为分析</div><p>${esc(ua.analysis)}</p><div class="ai-analysis-label" style="margin-top:10px">▸ 优化建议</div><ul class="ai-sug-list">${ua.suggestion.map(s=>`<li>${esc(s)}</li>`).join('')}</ul><details style="margin-top:10px"><summary style="cursor:pointer;color:var(--muted);font-size:11px;font-weight:700">行为证据明细</summary><div style="margin-top:8px;font-size:11px;color:var(--muted);line-height:1.7">主场景：${ua.evidence.topStages.map(s=>`${s[0]}(${s[1]})`).join('、')}<br>主要细分行为：${ua.evidence.topSubs.map(s=>`${s[0]}(${s[1]})`).join('、')}<br>最后到达节点：${esc(ua.evidence.lastReached)}<br>仅同日活跃：${ua.evidence.sameDay?'是':'否'}</div></details></div></div>`;
document.getElementById('timeline').innerHTML=u.timeline.map(e=>`<div class="event"><div class="event-time">${e.date.slice(5)}<br>${e.time.slice(0,8)}</div><div><div class="event-stage">${esc(e.stage)}</div><div class="event-sub">${esc(e.subStage||'')}<br><span style="color:var(--muted);font-weight:400">${e.role}</span></div></div><div class="event-body">${esc(e.body)}</div></div>`).join('');
document.getElementById('drawer').classList.add('open')}

document.getElementById('close').onclick=()=>document.getElementById('drawer').classList.remove('open');
document.getElementById('drawer').onclick=e=>{if(e.target.id==='drawer')e.currentTarget.classList.remove('open')};
fetch('analysis.json').then(r=>{if(!r.ok)throw new Error(`analysis.json 请求失败：${r.status}`);return r.json()}).then(render).catch(e=>{document.getElementById('app').innerHTML=`<div class="card empty">看板加载失败：${esc(e.message)}<br><small>请刷新页面重试，若仍失败请检查 analysis.json。</small></div>`;console.error(e)});
</script>
</body></html>
